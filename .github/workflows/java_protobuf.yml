name: Publish Java Protobufs
run-name: Publish Java Protobufs for Version ${{ inputs.substrait_version }}

concurrency:
  group: java-protobuf
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      substrait_version:
        description: Substrait version to generate protobuf for
        required: true
        type: string
  workflow_dispatch:
    inputs:
      substrait_version:
        description: Substrait version to generate protobuf for
        required: true
        type: string

env:
  SUBSTRAIT_VERSION: ${{ inputs.substrait_version }}
  TAG_NAME: "java/protobuf/${{ inputs.substrait_version }}"

jobs:

  java-protobuf-prechecks:
    runs-on: ubuntu-latest
    outputs:
      tag_exists: ${{ steps.check-tag.outputs.exists }}
      artifact_exists: ${{ steps.check-artifact.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Tag Existence
        id: check-tag
        run: |
          EXISTS=$(./scripts/tag_exists.sh "$TAG_NAME")
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
      - name: Check Artifact Existence on Maven Central
        id: check-artifact
        run: |
          EXISTS=$(./scripts/java/maven_central_package_exists.sh protobuf "$SUBSTRAIT_VERSION")
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"

  java-protobuf-generate:
    runs-on: ubuntu-latest
    needs: java-protobuf-prechecks
    steps:
      - name: Checkout substrait-packaging
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-release-git
        with:
          client-id: ${{ secrets.PACKAGER_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGER_KEY }}

      - name: Attach and Commit substrait Repo
        run: ./scripts/attach_subtree.sh

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate and Build Protobuf Code
        working-directory: java
        run: ./gradlew :protobuf:build -Pversion=${SUBSTRAIT_VERSION#v}

      # attach_subtree.sh already commits the substrait spec; the tag points at that commit.
      # Generated code is produced at build time and is intentionally not committed.
      - name: Tag and Push
        if: needs.java-protobuf-prechecks.outputs.tag_exists == 'false'
        run: |
          git tag -a "$TAG_NAME" -m "$TAG_NAME"
          git push origin "refs/tags/$TAG_NAME"

  java-protobuf-publish:
    runs-on: ubuntu-latest
    needs: [java-protobuf-prechecks, java-protobuf-generate]
    if: needs.java-protobuf-prechecks.outputs.artifact_exists == 'false'
    environment: maven-central
    steps:
      - name: Checkout substrait-packaging
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and Test
        working-directory: java
        run: ./gradlew :protobuf:build -Pversion=${SUBSTRAIT_VERSION#v}
      - name: Publish to Maven Central
        working-directory: java
        env:
          MAVENCENTRAL_USERNAME: ${{ secrets.M2_CENTRAL_USERNAME }}
          MAVENCENTRAL_PASSWORD: ${{ secrets.M2_CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.M2_SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.M2_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.M2_SIGNING_PASSWORD }}
        run: ./gradlew publishAggregationToCentralPortal -PpublishArtifact=protobuf -Pversion=${SUBSTRAIT_VERSION#v}
