name: Publish C++ Protobuf Package
run-name: Publish C++ Protobuf Package for Version ${{ inputs.substrait_version }}

concurrency:
  group: cpp-protobuf
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      substrait_version:
        description: Substrait version to generate protobuf for
        required: true
        type: string
      alpha:
        description: Publish an auto-incrementing alpha pre-release (-alpha, -alpha.1, ...)
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      substrait_version:
        description: Substrait version to generate protobuf for
        required: true
        type: string
      alpha:
        description: Publish an auto-incrementing alpha pre-release (-alpha, -alpha.1, ...)
        required: false
        default: false
        type: boolean

env:
  SUBSTRAIT_VERSION: ${{ inputs.substrait_version }}

jobs:

  cpp-protobuf-prechecks:
    runs-on: ubuntu-latest
    outputs:
      publish_version: ${{ steps.resolve.outputs.version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      tag_exists: ${{ steps.check-tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve Publish Version
        id: resolve
        run: |
          if [ "${{ inputs.alpha }}" = "true" ]; then
            VERSION=$(./scripts/cpp/next_alpha_version.sh substrait-protobuf "$SUBSTRAIT_VERSION")
          else
            VERSION="${SUBSTRAIT_VERSION#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=cpp/substrait-protobuf/v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check Tag Existence
        id: check-tag
        run: |
          EXISTS=$(./scripts/tag_exists.sh "${{ steps.resolve.outputs.tag_name }}")
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"

  # For C++ there is no registry upload: pushing the version tag publishes the
  # package (consumers FetchContent the tag). This job vendors the protos,
  # builds + tests the CMake package, commits the vendored protos, and pushes
  # the tag.
  cpp-protobuf-publish:
    runs-on: ubuntu-latest
    needs: cpp-protobuf-prechecks
    if: needs.cpp-protobuf-prechecks.outputs.tag_exists == 'false'
    steps:
      - name: Generate GitHub App Token for Pushing Tags
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.PACKAGER_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGER_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure GitHub User
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf https://github.com/

      - name: Checkout substrait-packaging
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.73.0

      - name: Attach and Commit substrait Repo
        run: ./scripts/attach_subtree.sh

      - name: Vendor Protobuf Definitions
        run: pixi run cpp-generate-protobuf

      - name: Build and Test
        run: |
          pixi run cmake -S cpp/substrait-protobuf -B cpp/substrait-protobuf/build -DCMAKE_BUILD_TYPE=Release
          pixi run cmake --build cpp/substrait-protobuf/build -j
          pixi run ctest --test-dir cpp/substrait-protobuf/build --output-on-failure

      - name: Commit Vendored Protos
        run: |
          git add cpp/substrait-protobuf
          git commit -m "Vendored C++ protobuf definitions for Substrait version $SUBSTRAIT_VERSION"

      - name: Tag and Push
        env:
          TAG_NAME: ${{ needs.cpp-protobuf-prechecks.outputs.tag_name }}
        run: |
          git tag -a "$TAG_NAME" -m "$TAG_NAME"
          git push origin "$TAG_NAME"

  # Register the freshly pushed tag in the vcpkg registry (bump the port, run
  # vcpkg x-add-version, push to the registry branch). Runs only when a new tag
  # was published, after the publish job succeeds.
  cpp-protobuf-registry:
    needs: [cpp-protobuf-prechecks, cpp-protobuf-publish]
    if: needs.cpp-protobuf-prechecks.outputs.tag_exists == 'false'
    uses: ./.github/workflows/cpp_registry.yml
    secrets: inherit
    with:
      package: substrait-protobuf
      version: ${{ needs.cpp-protobuf-prechecks.outputs.publish_version }}
