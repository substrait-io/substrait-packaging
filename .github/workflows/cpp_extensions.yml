name: Publish C++ Extensions Package
run-name: Publish C++ Extensions Package for Version ${{ inputs.substrait_version }}

concurrency:
  group: cpp-extensions
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      substrait_version:
        description: Substrait version to package extensions for
        required: true
        type: string
      alpha:
        description: Publish an auto-incrementing alpha pre-release (-alpha, -alpha.1, ...)
        required: false
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      substrait_version:
        description: Substrait version to package extensions for
        required: true
        type: string
      alpha:
        description: Publish an auto-incrementing alpha pre-release (-alpha, -alpha.1, ...)
        required: false
        default: true
        type: boolean

env:
  SUBSTRAIT_VERSION: ${{ inputs.substrait_version }}

jobs:

  cpp-extensions-prechecks:
    runs-on: ubuntu-latest
    outputs:
      publish_version: ${{ steps.resolve.outputs.version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      tag_exists: ${{ steps.check-tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve Publish Version
        id: resolve
        run: |
          if [ "${{ inputs.alpha }}" = "true" ]; then
            VERSION=$(./scripts/cpp/next_alpha_version.sh substrait-extensions "$SUBSTRAIT_VERSION")
          else
            VERSION="${SUBSTRAIT_VERSION#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=cpp/substrait-extensions/v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check Tag Existence
        id: check-tag
        run: |
          EXISTS=$(./scripts/tag_exists.sh "${{ steps.resolve.outputs.tag_name }}")
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"

  # For C++ there is no registry upload: pushing the version tag publishes the
  # package (consumers FetchContent the tag). This job vendors the extension
  # data, builds + tests the CMake package, commits the data, and pushes the
  # tag.
  cpp-extensions-publish:
    runs-on: ubuntu-latest
    needs: cpp-extensions-prechecks
    if: needs.cpp-extensions-prechecks.outputs.tag_exists == 'false'
    steps:
      - name: Generate GitHub App Token for Pushing Tags
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.PACKAGER_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGER_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure GitHub User
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf https://github.com/

      - name: Checkout substrait-packaging
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.62.2

      - name: Attach and Commit substrait Repo
        run: ./scripts/attach_subtree.sh

      - name: Vendor Extension Data
        run: pixi run cpp-generate-extensions

      - name: Build and Test
        run: |
          pixi run cmake -S cpp/substrait-extensions -B cpp/substrait-extensions/build -DCMAKE_BUILD_TYPE=Release
          pixi run cmake --build cpp/substrait-extensions/build -j
          pixi run ctest --test-dir cpp/substrait-extensions/build --output-on-failure

      - name: Commit Vendored Data
        run: |
          git add cpp/substrait-extensions
          git commit -m "Vendored C++ extension data for Substrait version $SUBSTRAIT_VERSION"

      - name: Tag and Push
        env:
          TAG_NAME: ${{ needs.cpp-extensions-prechecks.outputs.tag_name }}
        run: |
          git tag -a "$TAG_NAME" -m "$TAG_NAME"
          git push origin "$TAG_NAME"
