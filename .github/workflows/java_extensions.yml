name: Publish Substrait Extensions Files for Java
run-name: Publish Substrait Extensions Files for Java for Version ${{ inputs.substrait_version }}

concurrency:
  group: java-extensions
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      substrait_version:
        description: Substrait version to package extensions for
        required: true
        type: string
  workflow_dispatch:
    inputs:
      substrait_version:
        description: Substrait version to package extensions for
        required: true
        type: string

env:
  SUBSTRAIT_VERSION: ${{ inputs.substrait_version }}
  TAG_NAME: "java/extensions/${{ inputs.substrait_version }}"

jobs:

  java-extensions-prechecks:
    runs-on: ubuntu-latest
    outputs:
      tag_exists: ${{ steps.check-tag.outputs.exists }}
      artifact_exists: ${{ steps.check-artifact.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Tag Existence
        id: check-tag
        run: |
          EXISTS=$(./scripts/tag_exists.sh "$TAG_NAME")
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
      - name: Check Artifact Existence on Maven Central
        id: check-artifact
        run: |
          EXISTS=$(./scripts/java/maven_central_package_exists.sh extensions "$SUBSTRAIT_VERSION")
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"

  java-extensions-generate:
    runs-on: ubuntu-latest
    needs: java-extensions-prechecks
    steps:
      - name: Generate GitHub App Token for Pushing Tags
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.PACKAGER_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGER_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure GitHub User
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf https://github.com/

      - name: Checkout substrait-packaging
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Attach and Commit substrait Repo
        run: ./scripts/attach_subtree.sh

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Package Extension Files
        working-directory: java
        run: ./gradlew :extensions:build -Pversion=${SUBSTRAIT_VERSION#v}

      # attach_subtree.sh already commits the substrait spec; the tag points at that commit.
      # Generated code is produced at build time and is intentionally not committed.
      - name: Tag and Push
        if: needs.java-extensions-prechecks.outputs.tag_exists == 'false'
        run: |
          git tag -a "$TAG_NAME" -m "$TAG_NAME"
          git push origin "$TAG_NAME"

  java-extensions-publish:
    runs-on: ubuntu-latest
    needs: [java-extensions-prechecks, java-extensions-generate]
    if: needs.java-extensions-prechecks.outputs.artifact_exists == 'false'
    environment: maven-central
    steps:
      - name: Checkout substrait-packaging
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and Test
        working-directory: java
        run: ./gradlew :extensions:build -Pversion=${SUBSTRAIT_VERSION#v}
      - name: Publish to Maven Central
        working-directory: java
        env:
          MAVENCENTRAL_USERNAME: ${{ secrets.M2_CENTRAL_USERNAME }}
          MAVENCENTRAL_PASSWORD: ${{ secrets.M2_CENTRAL_PASSWORD }}
          SIGNING_KEY_ID: ${{ secrets.M2_SIGNING_KEY_ID }}
          SIGNING_KEY: ${{ secrets.M2_SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.M2_SIGNING_PASSWORD }}
        run: ./gradlew publishAggregationToCentralPortal -PpublishArtifact=extensions -Pversion=${SUBSTRAIT_VERSION#v}
