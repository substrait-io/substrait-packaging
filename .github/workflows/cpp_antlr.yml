name: Publish C++ ANTLR Package
run-name: Publish C++ ANTLR Package for Version ${{ inputs.substrait_version }}

concurrency:
  group: cpp-antlr
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      substrait_version:
        description: Substrait version to generate parsers for
        required: true
        type: string
  workflow_dispatch:
    inputs:
      substrait_version:
        description: Substrait version to generate parsers for
        required: true
        type: string

env:
  SUBSTRAIT_VERSION: ${{ inputs.substrait_version }}

jobs:

  cpp-antlr-prechecks:
    runs-on: ubuntu-latest
    outputs:
      publish_version: ${{ steps.resolve.outputs.version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      tag_exists: ${{ steps.check-tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve Publish Version
        id: resolve
        run: |
          VERSION="${SUBSTRAIT_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=cpp/substrait-antlr/v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check Tag Existence
        id: check-tag
        run: |
          EXISTS=$(./scripts/tag_exists.sh "${{ steps.resolve.outputs.tag_name }}")
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"

  # For C++ there is no registry upload: pushing the version tag publishes the
  # package (consumers FetchContent the tag). This job generates the parsers,
  # builds + tests the CMake package (the ANTLR runtime is fetched and built by
  # CMake), commits the generated parsers, and pushes the tag.
  cpp-antlr-publish:
    runs-on: ubuntu-latest
    needs: cpp-antlr-prechecks
    if: needs.cpp-antlr-prechecks.outputs.tag_exists == 'false'
    steps:
      - name: Generate GitHub App Token for Pushing Tags
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.PACKAGER_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGER_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure GitHub User
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf https://github.com/

      - name: Checkout substrait-packaging
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.73.0

      - name: Attach and Commit substrait Repo
        run: ./scripts/attach_subtree.sh

      - name: Generate ANTLR Parsers
        run: pixi run cpp-generate-antlr

      - name: Build and Test
        run: |
          pixi run cmake -S cpp/substrait-antlr -B cpp/substrait-antlr/build -DCMAKE_BUILD_TYPE=Release
          # Bound parallelism: the bundled ANTLR runtime has ~140 independent TUs
          # and an unbounded -j forks them all at once, OOM-killing the runner.
          pixi run cmake --build cpp/substrait-antlr/build -j 2
          pixi run ctest --test-dir cpp/substrait-antlr/build --output-on-failure

      - name: Commit Generated Parsers
        run: |
          git add cpp/substrait-antlr
          git commit -m "Generated C++ ANTLR parsers for Substrait version $SUBSTRAIT_VERSION"

      - name: Tag and Push
        env:
          TAG_NAME: ${{ needs.cpp-antlr-prechecks.outputs.tag_name }}
        run: |
          git tag -a "$TAG_NAME" -m "$TAG_NAME"
          git push origin "$TAG_NAME"

  # Register the freshly pushed tag in the vcpkg registry (bump the port, run
  # vcpkg x-add-version, push to the registry branch). Runs only when a new tag
  # was published, after the publish job succeeds.
  cpp-antlr-registry:
    needs: [cpp-antlr-prechecks, cpp-antlr-publish]
    if: needs.cpp-antlr-prechecks.outputs.tag_exists == 'false'
    uses: ./.github/workflows/cpp_registry.yml
    secrets: inherit
    with:
      package: substrait-antlr
      version: ${{ needs.cpp-antlr-prechecks.outputs.publish_version }}
