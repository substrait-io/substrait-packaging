name: Publish Go Protobuf Modules
run-name: Publish Go Protobuf Modules for Version ${{ inputs.substrait_version }}

concurrency:
  group: go-publish
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      substrait_version:
        description: Substrait version to generate bindings for
        required: true
        type: string
  workflow_dispatch:
    inputs:
      substrait_version:
        description: Substrait version to generate bindings for
        required: true
        type: string

env:
  SUBSTRAIT_VERSION: ${{ inputs.substrait_version }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [substrait-protobuf, substrait-protobuf-opaque]
    env:
      MODULE: ${{ matrix.module }}
      TAG: go/${{ matrix.module }}/${{ inputs.substrait_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-release-git
        with:
          client-id: ${{ secrets.PACKAGER_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGER_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/${{ matrix.module }}/go.mod
          cache: false
      - uses: prefix-dev/setup-pixi@v0.10.2
      - name: Attach Specification and Generate Bindings
        run: |
          ./scripts/attach_subtree.sh
          pixi run ./scripts/go/generate_protobuf.sh "$MODULE"
      - name: Build and Test
        working-directory: go/${{ matrix.module }}
        run: |
          go mod tidy
          go build ./...
          go test ./...
      - name: Commit and Publish Tag
        run: |
          git add "go/$MODULE"
          git commit -m "Generate $MODULE for Substrait $SUBSTRAIT_VERSION"
          git tag -a "$TAG" -m "$TAG"
          git push origin "refs/tags/$TAG"
