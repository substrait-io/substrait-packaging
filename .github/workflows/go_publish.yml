name: Publish Go Protobuf Modules
run-name: Publish Go Protobuf Modules for Version ${{ inputs.substrait_version }}

concurrency:
  group: go-publish
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      substrait_version:
        description: Substrait version to generate bindings for
        required: true
        type: string
      alpha:
        description: Publish an auto-incrementing alpha prerelease
        default: true
        type: boolean
  workflow_dispatch:
    inputs:
      substrait_version:
        description: Substrait version to generate bindings for
        required: true
        type: string
      alpha:
        description: Publish an auto-incrementing alpha prerelease
        default: true
        type: boolean

env:
  SUBSTRAIT_VERSION: ${{ inputs.substrait_version }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [substrait-protobuf, substrait-protobuf-opaque]
    env:
      MODULE: ${{ matrix.module }}
      MODULE_PATH: github.com/substrait-io/substrait-packaging/go/${{ matrix.module }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve Release
        id: release
        env:
          ALPHA: ${{ inputs.alpha }}
        run: |
          if ! printf '%s\n' "$SUBSTRAIT_VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: substrait_version must follow the format vx.y.z" >&2
            exit 1
          fi
          VERSION="${SUBSTRAIT_VERSION#v}"
          if [ "$ALPHA" = "true" ]; then
            VERSION=$(./scripts/go/next_alpha_version.sh "$MODULE" "$SUBSTRAIT_VERSION")
          fi
          TAG="go/$MODULE/v$VERSION"
          EXISTS=$(./scripts/tag_exists.sh "$TAG")
          PUBLISHED=$(./scripts/go/module_exists.sh "$MODULE_PATH" "$VERSION")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-release-git
        with:
          client-id: ${{ secrets.PACKAGER_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGER_KEY }}
      - name: Reuse Existing Release
        if: steps.release.outputs.exists == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git checkout --detach "$TAG"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/${{ matrix.module }}/go.mod
          cache: false
      - uses: prefix-dev/setup-pixi@v0.10.2
        if: steps.release.outputs.exists == 'false'
      - name: Attach Specification and Generate Bindings
        if: steps.release.outputs.exists == 'false'
        run: |
          ./scripts/attach_subtree.sh
          pixi run ./scripts/go/generate_protobuf.sh "$MODULE"
      - name: Build and Test
        working-directory: go/${{ matrix.module }}
        run: |
          go mod tidy
          go build ./...
          go test ./...
      - name: Commit and Publish Tag
        if: steps.release.outputs.exists == 'false'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git add "go/$MODULE"
          git commit -m "Generate $MODULE for Substrait $SUBSTRAIT_VERSION"
          ./scripts/push_tag.sh "$TAG"
      - name: Warm Go Module Proxy
        if: steps.release.outputs.published == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "https://proxy.golang.org/$MODULE_PATH/@v/v$VERSION.info"
