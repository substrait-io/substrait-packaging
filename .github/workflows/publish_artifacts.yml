name: Publish Substrait Artifacts
run-name: Publish Substrait Artifacts for Version ${{ inputs.substrait_version }}

concurrency:
  group: publish-artifacts
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      substrait_version:
        description: Substrait version to generate artifacts for
        required: true
        type: string
  workflow_dispatch:
    inputs:
      substrait_version:
        description: Substrait version to generate artifacts for
        required: true
        type: string

jobs:
  publish-python-artifacts:
    uses: ./.github/workflows/python_publish.yml
    secrets: inherit
    with:
      substrait_version: ${{ inputs.substrait_version }}
  # TEMPORARILY DISABLED: Java publishing is blocked on a Maven Central Portal 403 while the
  # `io.substrait` namespace is authorized for the publishing account. The Java workflows remain
  # manually dispatchable (java_publish.yml / java_*.yml) so the fix can be verified. Re-enable by
  # removing the `if: false` guard below once the Central Portal credentials/namespace are sorted.
  publish-java-artifacts:
    if: false
    uses: ./.github/workflows/java_publish.yml
    secrets: inherit
    with:
      substrait_version: ${{ inputs.substrait_version }}
  publish-rust-artifacts:
    uses: ./.github/workflows/rust_publish.yml
    secrets: inherit
    with:
      substrait_version: ${{ inputs.substrait_version }}
  publish-cpp-artifacts:
    uses: ./.github/workflows/cpp_publish.yml
    secrets: inherit
    with:
      substrait_version: ${{ inputs.substrait_version }}
