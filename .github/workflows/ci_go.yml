name: CI (Go)

on:
  pull_request:
    paths: &paths
      - scripts/**
      - pixi.toml
      - pixi.lock
      - go/**
      - .github/workflows/ci_go.yml
      - .github/workflows/go_*.yml
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:
    inputs:
      substrait_version:
        description: Substrait spec version to validate against (defaults to the latest release)
        required: false
        type: string

concurrency:
  group: ci-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve Substrait Version
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.substrait_version }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            VERSION="$OVERRIDE"
          else
            VERSION=$(./scripts/latest_release.sh)
          fi
          echo "Validating against substrait version: $VERSION"
          echo "SUBSTRAIT_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Configure Git Identity
        # attach_subtree.sh creates a squash commit, which needs an identity.
        run: |
          git config --global user.name 'substrait-packaging-ci'
          git config --global user.email 'substrait-packaging-ci@users.noreply.github.com'
      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.10.2
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/substrait-protobuf/go.mod
          cache: false
      - name: Attach substrait Spec Subtree
        run: ./scripts/attach_subtree.sh
      - name: Generate, Build and Test Both APIs
        run: |
          for MODULE in substrait-protobuf substrait-protobuf-opaque; do
            (
              cd "go/$MODULE"
              pixi run buf generate ../../substrait/proto
              go mod tidy
              go build ./...
              go test ./...
            )
          done
