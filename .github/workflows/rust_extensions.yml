name: Publish Substrait Extensions Files for Rust
run-name: Publish Rust Extension for Version ${{ inputs.substrait_version }}

concurrency:
  group: rust-extensions
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      substrait_version:
        description: Substrait version to package extensions for
        required: true
        type: string
  workflow_dispatch:
    inputs:
      substrait_version:
        description: Substrait version to package extensions for
        required: true
        type: string

env:
  SUBSTRAIT_VERSION: ${{ github.event.inputs.substrait_version }}
  TAG_NAME: "rust/substrait-extensions/${{ github.event.inputs.substrait_version }}"

jobs:

  rust-extensions-prechecks:
    runs-on: ubuntu-latest
    outputs:
      tag_exists: ${{ steps.check-tag.outputs.exists }}
      artifact_exists: ${{ steps.check-artifact.outputs.exists }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Tag Existence
        id: check-tag
        run: |
          EXISTS=$(./scripts/tag_exists.sh "$TAG_NAME")
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
      - name: Check Artifact Existence on crates.io
        id: check-artifact
        run: |
          EXISTS=$(./scripts/rust/crate_exists.sh substrait-extensions "$SUBSTRAIT_VERSION")
          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"

  rust-extensions-generate:
    runs-on: ubuntu-latest
    needs: rust-extensions-prechecks
    steps:
      - name: Generate GitHub App Token for Pushing Tags
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.PACKAGER_CLIENT_ID }}
          private-key: ${{ secrets.PACKAGER_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Configure GitHub User
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf https://github.com/

      - name: Checkout substrait-packaging
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.62.2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Attach and Commit substrait Repo
        run: ./scripts/attach_subtree.sh

      - name: Package Extension Files
        run: pixi run rust-generate-extensions

      - name: Set Version
        run: ./scripts/rust/set_version.sh rust/substrait-extensions "$SUBSTRAIT_VERSION"

      - name: Build and Test
        working-directory: rust/substrait-extensions
        run: |
          cargo build
          cargo test

      - name: Commit Generated Code
        run: |
          git add rust/substrait-extensions
          git commit -m "Packaged Substrait extensions for spec version $SUBSTRAIT_VERSION"

      - name: Tag and Push Generated Code
        if: needs.rust-extensions-prechecks.outputs.tag_exists == 'false'
        run: |
          git tag -a "$TAG_NAME" -m "$TAG_NAME"
          git push origin "$TAG_NAME"

  rust-extensions-publish:
    runs-on: ubuntu-latest
    needs: [rust-extensions-prechecks, rust-extensions-generate]
    if: needs.rust-extensions-prechecks.outputs.artifact_exists == 'false'
    environment: crates-io
    defaults:
      run:
        working-directory: rust/substrait-extensions
    steps:
      - name: Checkout substrait-extensions
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG_NAME }}
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish
