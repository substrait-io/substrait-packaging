[workspace]
name = "substrait-packaging"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "linux-aarch64"]

[tasks]
python-generate-antlr = { cmd = "cd python/substrait-antlr && ./generate_antlr.sh", description = "Generate ANTLR Python parsers" }
python-generate-protobuf = { cmd = "cd python/substrait-protobuf && ./generate_protobuf.sh", description = "Generate protobuf Python code" }
python-generate-extensions = { cmd = "cd python/substrait-extensions && ./generate_extensions.sh", description = "Package Substrait extensions files" }
java-generate-protobuf = { cmd = "cd java && ./gradlew :protobuf:generateProto", description = "Generate protobuf Java code" }
java-generate-antlr = { cmd = "cd java && ./gradlew :antlr:generateGrammarSource", description = "Generate ANTLR Java parsers" }
java-build = { cmd = "cd java && ./gradlew build", description = "Build and test all Java artifacts" }
rust-generate-antlr = { cmd = "cd rust/substrait-antlr && ./generate_antlr.sh", description = "Generate ANTLR Rust parsers" }
rust-generate-prost = { cmd = "cd rust/substrait-prost && ./generate_protobuf.sh", description = "Vendor protobuf definitions for the Rust crate" }
rust-generate-extensions = { cmd = "cd rust/substrait-extensions && ./generate_extensions.sh", description = "Package Substrait extensions files for Rust" }
cpp-generate-protobuf = { cmd = "cd cpp/substrait-protobuf && ./generate_protobuf.sh", description = "Vendor protobuf definitions for the C++ package" }
cpp-generate-antlr = { cmd = "cd cpp/substrait-antlr && ./generate_antlr.sh", description = "Generate ANTLR C++ parsers" }
cpp-generate-extensions = { cmd = "cd cpp/substrait-extensions && ./generate_extensions.sh", description = "Package Substrait extensions files for C++" }
csharp-generate-protobuf = { cmd = "cd csharp/Substrait.Protobuf && ./generate_protobuf.sh", description = "Vendor protobuf definitions for the C# package" }
csharp-generate-antlr = { cmd = "cd csharp/Substrait.Antlr && ./generate_antlr.sh", description = "Generate ANTLR C# parsers" }
csharp-generate-extensions = { cmd = "cd csharp/Substrait.Extensions && ./generate_extensions.sh", description = "Package Substrait extensions files for C#" }
csharp-build = { cmd = "cd csharp && dotnet test Substrait.slnx", description = "Build and test all C# artifacts" }

[dependencies]
# Note for the C# target: Antlr4.Runtime.Standard trails the tool (4.13.1 is the
# newest published C# runtime). That is safe while both agree on major.minor,
# which is all ANTLR's RuntimeMetaData.CheckVersion compares, but a bump to 4.14
# needs a matching C# runtime release first.
antlr = ">=4.13.2,<5"
buf = ">=1.62.1,<2"
datamodel-code-generator = ">=0.52.0,<0.53"
ruff = ">=0.14.10,<0.15"
uv = ">=0.9.25,<1"
# Required to run the forked ANTLR JAR for the Rust parser generation, and to
# satisfy the Java build's Gradle toolchain (Java 21).
openjdk = ">=21,<26"
# C++ packaging: build/test the generated CMake source packages. libprotobuf
# provides the protobuf C++ library, headers, protoc and the CMake config used
# by the substrait-protobuf package. The ANTLR C++ runtime is built
# hermetically by the substrait-antlr package via FetchContent (no conda runtime
# dep, so it builds identically on every platform and for downstream consumers).
cmake = ">=3.24,<4"
cxx-compiler = ">=1.7,<2"
libprotobuf = ">=5"
# C# packaging: build, test and pack the NuGet packages. The SDK also supplies
# protoc and the C# protobuf plugin via the Grpc.Tools NuGet package, so no
# separate protoc dependency is needed for the C# target.
dotnet-sdk = ">=10,<11"
