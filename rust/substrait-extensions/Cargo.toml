# SPDX-License-Identifier: Apache-2.0
[package]
name = "substrait-extensions"
version = "0.100.0"
edition = "2021"
rust-version = "1.85.1"
description = "Packaged Substrait Extension Files"
documentation = "https://docs.rs/substrait-extensions"
readme = "README.md"
homepage = "https://substrait.io"
repository = "https://github.com/substrait-io/substrait-packaging"
license = "Apache-2.0"
keywords = ["substrait"]
build = "build.rs"
# The extension YAML files, text schemas and test cases are vendored into this
# directory by `generate_extensions.sh` and shipped in the published crate.
include = [
    "build.rs",
    "src/**/*.rs",
    "extensions/**/*.yaml",
    "text/**/*.yaml",
    "testcases/**/*.test",
]

[dependencies]
indexmap = { version = "2.7.0", features = ["serde"] }
include_dir = { version = "0.7.4", features = ["glob"] }
# Required by the typify-generated text types: the generated code emits
# ::regress::Regex for `pattern` validations.
regress = "0.11.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde_yaml = "0.9.34"

[build-dependencies]
heck = "0.5.0"
prettyplease = "0.3.0"
# Pinned to 0.8 to match the schemars version used by typify (0.7): build.rs
# feeds schemars types straight into typify, so this must track typify's
# schemars, not the latest release. Bumping to 1.x breaks the build.
schemars = "0.8.22"
serde_yaml = "0.9.34"
syn = "3.0.2"
typify = "0.7.0"
walkdir = "2.5.0"

[package.metadata.docs.rs]
all-features = true
