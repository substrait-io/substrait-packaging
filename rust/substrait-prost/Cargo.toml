# SPDX-License-Identifier: Apache-2.0
[package]
name = "substrait-prost"
version = "0.103.0"
edition = "2021"
rust-version = "1.85.1"
description = "Generated Substrait Protocol Buffer Code"
documentation = "https://docs.rs/substrait-prost"
readme = "README.md"
homepage = "https://substrait.io"
repository = "https://github.com/substrait-io/substrait-packaging"
license = "Apache-2.0"
keywords = ["substrait"]
build = "build.rs"
# Only the vendored `.proto` files (copied in by `generate_protobuf.sh`) and the
# Rust sources are shipped; the generated Rust code is produced at build time.
include = [
    "build.rs",
    "src/**/*.rs",
    "proto/**/*.proto",
]

[features]
default = []
# Embed the protobuf file descriptor set for reflection.
embed-descriptor = []
# Derive `prost_reflect::ReflectMessage` for all message types, enabling runtime
# protobuf introspection against the embedded descriptor set. Implies
# `embed-descriptor`, which the generated reflection code reads at runtime.
reflect = ["dep:prost-reflect", "dep:prost-reflect-build", "embed-descriptor"]
# Build and vendor protoc from source for a consistent compiler across
# platforms
protoc = ["dep:protobuf-src"]
# Use the pure-Rust `protox` compiler instead of `protoc`, so no external
# toolchain is required (used by docs.rs).
protox = ["dep:protox"]
# Serialize and deserialize implementations for proto types using `pbjson`,
# following the Protobuf JSON Mapping.
serde = ["dep:pbjson", "dep:pbjson-build", "dep:pbjson-types", "dep:serde", "dep:serde_json"]

[dependencies]
pbjson = { version = "0.9.0", optional = true }
pbjson-types = { version = "0.9.0", optional = true }
prost = "0.14.1"
prost-reflect = { version = "0.16.4", features = ["derive"], optional = true }
prost-types = "0.14.1"
serde = { version = "1.0.228", features = ["derive"], optional = true }
# Deliberately *without* `preserve_order`: that feature is global, so enabling
# it here would switch `serde_json::Map` to `IndexMap` for every crate in a
# downstream build with no way to opt out. Nothing here depends on `Map`
# iteration order.
serde_json = { version = "1.0.145", optional = true }

[build-dependencies]
pbjson-build = { version = "0.9.0", optional = true }
prost-build = { version = "0.14.1", default-features = false }
prost-reflect-build = { version = "0.16.0", optional = true }
protobuf-src = { version = "2.1.1", optional = true }
protox = { version = "0.9.1", optional = true }
walkdir = "2.5.0"

[dev-dependencies]
prost = "0.14.1"

[package.metadata.docs.rs]
features = ["protox"]
