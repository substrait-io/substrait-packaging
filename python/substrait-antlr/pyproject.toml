[project]
name = "substrait-antlr"
version = "0.0.0"
description = "Generated Substrait ANTLR Parser Code"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Substrait Contributors", email = "substrait@googlegroups.com"}
]

dependencies = [
    "antlr4-python3-runtime >=4.13,<5",
]

[project.urls]
Homepage = "https://substrait.io"
Repository = "https://github.com/substrait-io/substrait-packaging"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = "tests"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

# Ignore PyPI packages published in the last 14 days when locking, matching the
# exclude-newer cutoff in /pixi.toml. See CONTRIBUTING.md.
[tool.uv]
exclude-newer = "14 days"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
