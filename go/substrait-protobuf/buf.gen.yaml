version: v2
# Remove previously generated files before regenerating so deletions in the spec
# are reflected in the published module.
clean: true
managed:
  enabled: true
  override:
    # Pin the Go import path to this module so the generated code is importable as
    # github.com/substrait-io/substrait-packaging/go/substrait-protobuf/substraitpb.
    - file_option: go_package
      value: github.com/substrait-io/substrait-packaging/go/substrait-protobuf/substraitpb
    - file_option: go_package
      path: substrait/extensions/extensions.proto
      value: github.com/substrait-io/substrait-packaging/go/substrait-protobuf/substraitpb/extensions

plugins:
  # protoc-gen-go ships in google.golang.org/protobuf, so `go run` from the module
  # root builds it at the version go.mod requires: the generator and the runtime
  # cannot drift apart. No protoc is needed; buf compiles the protos itself.
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go"]
    out: substraitpb
    opt:
      - module=github.com/substrait-io/substrait-packaging/go/substrait-protobuf/substraitpb
      # Hybrid API: exported struct fields (Open API) alongside Get/Set/Has/Clear
      # accessors and Builder types (Opaque API), so consumers can migrate
      # incrementally. See https://protobuf.dev/reference/go/opaque-migration/.
      - default_api_level=API_HYBRID
